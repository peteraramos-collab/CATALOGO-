<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ges-in | Tour 360° Interactivo</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        :root { 
            --azul: #3498db; 
            --oscuro: #1a1a1a; 
            --oro: #f1c40f; 
            --verde: #25d366;
            --gris-claro: #ecf0f1;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000; 
        }

        /* Panel Lateral Mejorado */
        #sidebar {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 320px; 
            height: 100%;
            background: linear-gradient(135deg, var(--oscuro) 0%, #2c3e50 100%);
            color: white; 
            z-index: 2000;
            display: flex; 
            flex-direction: column; 
            box-shadow: 4px 0 20px rgba(0,0,0,0.5);
            transform: translateX(0);
            transition: transform 0.3s ease;
        }

        .toggle-sidebar {
            position: fixed;
            left: 10px;
            top: 10px;
            background: var(--azul);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 2001;
            cursor: pointer;
            display: none;
            font-size: 18px;
        }

        .header-logo { 
            padding: 20px; 
            text-align: center; 
            background: white;
            border-bottom: 3px solid var(--oro);
        }
        
        .header-logo img { 
            max-width: 150px; 
            height: auto; 
        }

        #lista-propiedades { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 15px;
            max-height: calc(100% - 180px);
        }

        #lista-propiedades::-webkit-scrollbar {
            width: 8px;
        }
        #lista-propiedades::-webkit-scrollbar-track {
            background: #2c3e50;
        }
        #lista-propiedades::-webkit-scrollbar-thumb {
            background: var(--azul);
            border-radius: 4px;
        }

        .card {
            background: rgba(52, 73, 94, 0.9);
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateX(5px);
            background: #34495e;
        }
        .card.active { 
            border-left-color: var(--oro); 
            background: #2c3e50;
            box-shadow: 0 2px 10px rgba(241, 196, 15, 0.2);
        }
        .card strong { font-size: 1.1em; display: block; margin-bottom: 5px; }
        .card small { color: var(--oro); font-size: 0.85em; }

        .btn-publicar {
            background: var(--oro);
            color: #000;
            text-align: center;
            padding: 12px;
            margin: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        .btn-publicar:hover { transform: scale(1.02); box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3); }

        .galeria-minis { 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px; 
            margin-top: 12px; 
        }
        .mini { 
            width: 100%;
            height: 60px;
            border-radius: 6px; 
            cursor: pointer; 
            border: 2px solid transparent; 
            object-fit: cover; 
            transition: all 0.2s ease;
        }
        .mini:hover { border-color: var(--oro); transform: scale(1.05); }

        .info-box { 
            background: rgba(0,0,0,0.8);
            padding: 15px;
            font-size: 0.9em;
            border-top: 2px solid var(--oro);
            backdrop-filter: blur(10px);
        }
        .btn-wa {
            display: block;
            text-align: center;
            background: var(--verde);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 5px;
            margin-top: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-wa:hover { transform: scale(1.02); }

        /* Modal de imágenes */
        #modal-visor {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 5000;
            justify-content: center;
            align-items: center;
        }
        #modal-img { max-width: 90%; max-height: 90%; border-radius: 10px; }
        #btn-cerrar {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 45px;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #btn-cerrar:hover { background: rgba(255,0,0,0.5); transform: rotate(90deg); }

        /* Publicidad (auspiciantes) */
        #auspiciantes {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-radius: 40px;
            display: flex;
            gap: 15px;
            z-index: 2000;
            align-items: center;
            border: 1px solid var(--oro);
        }
        #auspiciantes span { color: white; font-size: 12px; margin-right: 5px; }
        #auspiciantes img { height: 35px; width: auto; border-radius: 5px; }

        /* Indicador de carga y ayuda */
        .loading-indicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: var(--oro);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 2000;
            display: none;
        }
        .help-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--azul);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2000;
            font-weight: bold;
        }
        .tooltip {
            position: fixed;
            bottom: 70px;
            left: 20px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 12px;
            max-width: 250px;
            z-index: 2000;
            display: none;
        }

        @media (max-width: 768px) {
            .toggle-sidebar { display: block; }
            #sidebar { transform: translateX(-100%); width: 280px; }
            #sidebar.open { transform: translateX(0); }
            #auspiciantes { bottom: 10px; right: 10px; padding: 6px 12px; }
            #auspiciantes img { height: 25px; }
        }
    </style>
</head>
<body>

    <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>
    <div class="help-btn" onclick="showHelp()">?</div>
    <div class="tooltip" id="tooltip">🖱️ Haz clic y arrastra para ver 360°<br>📍 Los puntos verdes dan más información</div>
    <div class="loading-indicator" id="loading">🔄 Cargando vista...</div>

    <div id="modal-visor" onclick="cerrarDetalle()">
        <span id="btn-cerrar" onclick="event.stopPropagation(); cerrarDetalle()">&times;</span>
        <img id="modal-img" src="" onclick="event.stopPropagation()">
    </div>

    <!-- Publicidad / Auspiciantes (logo1.png y logo2.png) -->
    <div id="auspiciantes">
        <span>ALIADOS:</span>
        <img src="logo1.png" alt="Logo 1" onerror="this.src='https://via.placeholder.com/35?text=Logo1'">
        <img src="logo2.png" alt="Logo 2" onerror="this.src='https://via.placeholder.com/35?text=Logo2'">
    </div>

    <div id="sidebar">
        <div class="header-logo">
            <img src="Gesin.png" alt="Ges-in" onerror="this.src='https://via.placeholder.com/150x60?text=Ges-in'">
        </div>
        <!-- Enlace WhatsApp directo (sin abrir web, abre la app si está instalada) -->
        <a href="https://api.whatsapp.com/send?phone=593995042091&text=Quiero%20publicar%20mi%20terreno" class="btn-publicar" target="_blank">
            📢 ¡PUBLICA TU PROPIEDAD AQUÍ!
        </a>
        <div id="lista-propiedades"></div>
        <div class="info-box">
            <h3 id="p-titulo" style="margin:0; color: var(--oro);">Selecciona una propiedad</h3>
            <p id="p-desc" style="opacity: 0.8; margin: 8px 0;"></p>
            <div id="p-specs" style="color: var(--azul); font-weight: bold;"></div>
            <div class="galeria-minis" id="p-galeria"></div>
            <a href="#" id="btn-whatsapp-link" class="btn-wa" target="_blank">
                💬 Consultar por WhatsApp
            </a>
        </div>
    </div>

    <a-scene renderer="exposure: 1.2;">
        <a-assets>
            <!-- Imágenes 360° -->
            <img id="360_1" src="1.jpeg" crossorigin="anonymous">
            <img id="360_2" src="2.jpeg" crossorigin="anonymous">
            <!-- Usamos mifoto.jpeg como tercera opción -->
            <img id="360_3" src="mifoto.jpeg" crossorigin="anonymous">
        </a-assets>

        <!-- Sky 360 -->
        <a-sky id="main-sky" rotation="0 -90 0" src="#360_1"></a-sky>

        <!-- Contenedor de hotspots (puntos interactivos) -->
        <a-entity id="hotspots-container"></a-entity>

        <!-- Cámara con cursor -->
        <a-entity camera look-controls position="0 1.6 0">
            <a-cursor color="var(--oro)" fuse="true" fuse-timeout="2000"></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        const TELEFONO_AGENTE = "593995042091"; // Formato internacional sin +
        const WHATSAPP_PUBLICAR = `https://api.whatsapp.com/send?phone=${TELEFONO_AGENTE}&text=Quiero%20publicar%20mi%20terreno`;

        // Catálogo de propiedades con nombres reales de archivos
        const catalogo = [
            { 
                titulo: "🌄 Lote Vista Hermosa", 
                desc: "Terreno con vista panorámica, ideal para agricultura o casa de campo. Suelo fértil y acceso por vía lastrada.", 
                specs: "📍 Pacto | 9 Ha | $45,000",
                precio: "$45,000",
                foto: "#360_1", 
                extras: ["a.jpg", "b.jpg"],
                ubicacion: "Pacto, Ecuador",
                // Hotspots: cada uno con posición (x,y,z) y mensaje
                hotspots: [
                    { pos: "5 1 -3", msg: "🌳 Área boscosa protegida" },
                    { pos: "-4 1.5 -5", msg: "💧 Vertiente de agua natural" },
                    { pos: "2 1 6", msg: "🚧 Acceso principal" }
                ]
            },
            { 
                titulo: "🏢 Terreno Comercial Centro", 
                desc: "Lote en pleno centro urbano, alto flujo peatonal y vehicular. Perfecto para local comercial o edificio de oficinas.", 
                specs: "📍 Centro | 600 m² | $120,000",
                precio: "$120,000",
                foto: "#360_2", 
                extras: ["c.jpg", "d.jpg"],
                ubicacion: "Centro Histórico",
                hotspots: [
                    { pos: "3 1 -4", msg: "🏪 Zona bancaria cerca" },
                    { pos: "-2 1.2 5", msg: "🚏 Parada de buses" },
                    { pos: "0 1.5 -6", msg: "📡 Fibra óptica disponible" }
                ]
            },
            { 
                titulo: "🏞️ Reserva Ecológica", 
                desc: "Propiedad con bosque secundario y senderos naturales. Potencial para ecoturismo o cabañas sostenibles.", 
                specs: "📍 Reserva | 15 Ha | Consultar",
                precio: "Consultar",
                foto: "#360_3", 
                extras: ["a.jpg", "c.jpg", "d.jpg"],
                ubicacion: "Zona de Reserva",
                hotspots: [
                    { pos: "4 1 -2", msg: "🦋 Mirador de aves" },
                    { pos: "-3 0.8 -4", msg: "🏕️ Área para camping" }
                ]
            }
        ];

        let currentIndex = 0;
        let currentHotspots = []; // guardar entidades creadas

        function renderizarMenu() {
            const container = document.getElementById('lista-propiedades');
            container.innerHTML = '';
            catalogo.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<strong>${item.titulo}</strong><small>${item.precio}</small>`;
                div.onclick = (e) => {
                    e.stopPropagation();
                    seleccionarPropiedad(index, div);
                };
                container.appendChild(div);
            });
            if(catalogo.length) setTimeout(() => {
                const firstCard = document.querySelector('.card');
                if(firstCard) seleccionarPropiedad(0, firstCard);
            }, 100);
        }

        function mostrarCargando(show) {
            const loader = document.getElementById('loading');
            loader.style.display = show ? 'block' : 'none';
        }

        // Limpiar hotspots anteriores
        function limpiarHotspots() {
            const container = document.getElementById('hotspots-container');
            while(container.firstChild) container.removeChild(container.firstChild);
        }

        // Crear hotspots según la propiedad
        function crearHotspots(hotspotsArray) {
            const container = document.getElementById('hotspots-container');
            hotspotsArray.forEach(h => {
                const sphere = document.createElement('a-sphere');
                sphere.setAttribute('position', h.pos);
                sphere.setAttribute('radius', '0.2');
                sphere.setAttribute('color', '#00ff00');
                sphere.setAttribute('emissive', '#2ecc71');
                sphere.setAttribute('animation', 'property: scale; to: 1.2 1.2 1.2; loop: true; dur: 800; dir: alternate');
                sphere.setAttribute('class', 'hotspot');
                // Al hacer clic muestra la información
                sphere.addEventListener('click', () => {
                    alert(`📌 Información del punto:\n${h.msg}`);
                });
                // Efecto de texto flotante al mirar (cursor)
                sphere.setAttribute('cursor-listener', '');
                // Opcional: tooltip con texto
                const text = document.createElement('a-text');
                text.setAttribute('value', h.msg);
                text.setAttribute('position', `0 0.4 0`);
                text.setAttribute('color', '#f1c40f');
                text.setAttribute('scale', '0.5 0.5 0.5');
                text.setAttribute('align', 'center');
                text.setAttribute('visible', 'false');
                sphere.appendChild(text);
                sphere.addEventListener('mouseenter', () => text.setAttribute('visible', 'true'));
                sphere.addEventListener('mouseleave', () => text.setAttribute('visible', 'false'));
                container.appendChild(sphere);
            });
        }

        function seleccionarPropiedad(index, elemento) {
            if(index === currentIndex) return;
            currentIndex = index;
            const p = catalogo[index];
            mostrarCargando(true);
            
            // Cambiar imagen 360
            const sky = document.querySelector('#main-sky');
            sky.setAttribute('src', p.foto);
            
            // Actualizar info panel
            document.getElementById('p-titulo').innerHTML = p.titulo;
            document.getElementById('p-desc').innerText = p.desc;
            document.getElementById('p-specs').innerHTML = `💰 ${p.specs}`;
            
            // Mini galería
            const galeria = document.getElementById('p-galeria');
            galeria.innerHTML = "";
            if(p.extras && p.extras.length) {
                p.extras.forEach(imgUrl => {
                    const img = document.createElement('img');
                    img.src = imgUrl;
                    img.className = 'mini';
                    img.onclick = (e) => { e.stopPropagation(); verDetalle(imgUrl); };
                    img.onerror = () => img.src = 'https://via.placeholder.com/70x50?text=No+img';
                    galeria.appendChild(img);
                });
            } else {
                galeria.innerHTML = '<p style="font-size:11px;">📸 Sin imágenes adicionales</p>';
            }
            
            // Link WhatsApp personalizado
            const msg = `Hola Ges-in, me interesa: ${p.titulo}\n📍 ${p.ubicacion}\n💰 ${p.precio}\n¿Podrían darme más información?`;
            document.getElementById('btn-whatsapp-link').href = `https://api.whatsapp.com/send?phone=${TELEFONO_AGENTE}&text=${encodeURIComponent(msg)}`;
            
            // Resaltar tarjeta activa
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            if(elemento) elemento.classList.add('active');
            
            // Actualizar hotspots
            limpiarHotspots();
            if(p.hotspots && p.hotspots.length) {
                crearHotspots(p.hotspots);
            }
            
            setTimeout(() => mostrarCargando(false), 500);
        }

        function verDetalle(src) {
            const modal = document.getElementById('modal-visor');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = src;
            modal.style.display = "flex";
            document.body.style.overflow = 'hidden';
        }
        function cerrarDetalle() {
            document.getElementById('modal-visor').style.display = "none";
            document.body.style.overflow = '';
        }
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
        function showHelp() {
            const tooltip = document.getElementById('tooltip');
            tooltip.style.display = 'block';
            setTimeout(() => tooltip.style.display = 'none', 4000);
        }
        // Cerrar modal con ESC
        document.addEventListener('keydown', (e) => { if(e.key === 'Escape') cerrarDetalle(); });
        // Cerrar sidebar si clic fuera en móvil
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.querySelector('.toggle-sidebar');
            if(window.innerWidth <= 768 && sidebar.classList.contains('open') && !sidebar.contains(e.target) && !toggle.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });
        
        window.onload = () => {
            renderizarMenu();
            setTimeout(showHelp, 1500);
        };
    </script>
</body>
</html>
