<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ges-in | Catálogo 360 Pro</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        :root { --azul: #3498db; --oscuro: #1a1a1a; --oro: #f1c40f; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }

        #sidebar {
            position: fixed; top: 0; left: 0; width: 280px; height: 100%;
            background: var(--oscuro); color: white; z-index: 2000;
            display: flex; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.5);
        }

        .header-logo { padding: 15px; text-align: center; background: white; }
        .header-logo img { max-width: 140px; height: auto; }

        #lista-propiedades { flex-grow: 1; overflow-y: auto; padding: 15px; }

        .card {
            background: #2c3e50; padding: 12px; margin-bottom: 10px;
            border-radius: 8px; cursor: pointer; border-left: 4px solid transparent; transition: 0.3s;
        }

        .card:hover { background: #34495e; border-left-color: var(--oro); }
        .card.active { background: #34495e; border-left-color: var(--azul); }

        .info-box { background: #000; padding: 15px; font-size: 0.85em; border-top: 1px solid #444; }
        
        .btn-wa {
            display: block; text-align: center; background: #25d366; color: white;
            text-decoration: none; padding: 10px; border-radius: 5px; margin-top: 8px; font-weight: bold;
        }

        #loader {
            position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.7);
            color: var(--oro); padding: 8px 15px; border-radius: 20px; font-size: 12px; z-index: 3000;
        }
    </style>
</head>
<body>

    <div id="loader">Esperando selección...</div>

    <div id="sidebar">
        <div class="header-logo">
            <img src="Gesin.png" alt="Logo Ges-in">
        </div>
        
        <div id="lista-propiedades"></div>

        <div class="info-box">
            <h3 id="p-titulo" style="margin:0; color: var(--oro);">Gestiones Integrales</h3>
            <p id="p-desc" style="opacity: 0.8; margin: 8px 0;">Seleccione una propiedad para iniciar el recorrido.</p>
            <div id="p-specs" style="font-weight: bold; color: var(--azul); margin-bottom: 5px;"></div>
            <a href="https://wa.me/tu_numero" class="btn-wa" target="_blank">Consultar por WhatsApp</a>
        </div>
    </div>

    <a-scene renderer="antialias: true; colorManagement: true;">
        <a-sky id="main-sky" rotation="0 -90 0" color="#111"></a-sky>
        
        <a-entity camera look-controls="pointerLockEnabled: false">
            <a-cursor color="var(--oro)"></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        const catalogo = [
            {
                titulo: "Oficina Matriz",
                desc: "Sede administrativa de Gestiones Integrales.",
                specs: "San Miguel de los Bancos",
                archivo: "mifoto.jpeg" 
            },
            {
                titulo: "Propiedad Lote 1",
                desc: "Vista aérea capturada con DJI Mini 3.",
                specs: "Sector Pacto | 9 Hectáreas",
                archivo: "1.jpeg" 
            },
            {
                titulo: "Propiedad Lote 2",
                desc: "Lote listo para desarrollo.",
                specs: "Sector Centro | 600m²",
                archivo: "2.jpeg" 
            }
        ];

        const contenedor = document.getElementById('lista-propiedades');
        const sky = document.querySelector('#main-sky');
        const loader = document.getElementById('loader');

        function renderizarMenu() {
            catalogo.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<strong>${item.titulo}</strong>`;
                div.onclick = () => seleccionar(index, div);
                contenedor.appendChild(div);
            });
        }

        function seleccionar(index, elemento) {
            const p = catalogo[index];
            loader.style.display = "block";
            loader.innerText = "Cargando panorama...";

            // TRUCO PARA GITHUB: Forzamos la recarga del src
            sky.setAttribute('src', ''); // Limpiamos primero
            
            // Usamos una pequeña demora para asegurar que el motor gráfico procese el cambio
            setTimeout(() => {
                sky.setAttribute('src', p.archivo);
                
                // Actualizar interfaz
                document.getElementById('p-titulo').innerText = p.titulo;
                document.getElementById('p-desc').innerText = p.desc;
                document.getElementById('p-specs').innerText = p.specs;

                // Estética del menú
                document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
                elemento.classList.add('active');
                
                loader.innerText = "Vista: " + p.titulo;
            }, 100);
        }

        window.onload = () => {
            renderizarMenu();
            // Cargar la primera automáticamente después de un segundo
            setTimeout(() => {
                if(document.querySelector('.card')) {
                    seleccionar(0, document.querySelector('.card'));
                }
            }, 1000);
        };
    </script>
</body>
</html>
