<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ges-in | Catálogo 360</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        :root { --azul: #3498db; --oscuro: #1a1a1a; --oro: #f1c40f; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

        /* Panel Lateral */
        #sidebar {
            position: fixed;
            top: 0; left: 0; width: 300px; height: 100%;
            background: var(--oscuro);
            color: white;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
        }

        .header-logo { padding: 15px; text-align: center; background: white; }
        .header-logo img { max-width: 150px; height: auto; }

        #lista-propiedades { flex-grow: 1; overflow-y: auto; padding: 15px; }

        .card {
            background: #2c3e50;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: 0.3s;
        }

        .card:hover { border-left-color: var(--oro); background: #34495e; }
        .card.active { border-left-color: var(--azul); background: #34495e; }

        .info-box { background: #000; padding: 15px; font-size: 0.85em; border-top: 1px solid #444; }
        
        .btn-wa {
            display: block; text-align: center; background: #25d366; color: white;
            text-decoration: none; padding: 10px; border-radius: 5px; margin-top: 8px; font-weight: bold;
        }

        /* Aviso si algo falla */
        #error-log {
            position: fixed; bottom: 10px; right: 10px;
            background: rgba(255,0,0,0.8); color: white;
            padding: 5px 10px; font-size: 10px; z-index: 3000; display: none;
        }
    </style>
</head>
<body>

    <div id="error-log">Error cargando archivos...</div>

    <div id="sidebar">
        <div class="header-logo">
            <img src="Gesin.png" alt="Gestiones Integrales">
        </div>
        
        <div id="lista-propiedades"></div>

        <div class="info-box" id="detalle-propiedad">
            <h3 id="p-titulo" style="margin:0; color: var(--oro);">Cargando...</h3>
            <p id="p-desc" style="opacity: 0.8; margin: 8px 0;">Ges-in facilitando tus trámites.</p>
            <div id="p-specs" style="font-weight: bold; color: var(--azul); margin-bottom: 5px;"></div>
            <a href="https://wa.me/tu_numero" class="btn-wa" target="_blank">WhatsApp</a>
        </div>
    </div>

    <a-scene embedded style="width: 100%; height: 100vh;">
        <a-assets>
            <img id="img_mifoto" src="mifoto.jpeg" crossorigin="anonymous">
            <img id="img_1" src="1.jpeg" crossorigin="anonymous">
            <img id="img_2" src="2.jpeg" crossorigin="anonymous">
        </a-assets>

        <a-sky id="main-sky" src="#img_mifoto" rotation="0 -90 0"></a-sky>
        
        <a-entity camera look-controls>
            <a-cursor color="var(--oro)"></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        // BASE DE DATOS - Asegúrate de que los nombres coincidan con los de arriba
        const catalogo = [
            {
                titulo: "Oficina Matriz",
                desc: "Sede principal Ges-in en San Miguel de los Bancos.",
                specs: "Área: 45m² | Internet fibra",
                fotoId: "#img_mifoto"
            },
            {
                titulo: "Propiedad Lote 1",
                desc: "Excelente ubicación con potencial agrícola.",
                specs: "9 Hectáreas | Sector Pacto",
                fotoId: "#img_1"
            },
            {
                titulo: "Propiedad Lote 2",
                desc: "Terreno listo para construcción urbana.",
                specs: "600m² | Servicios completos",
                fotoId: "#img_2"
            }
        ];

        const contenedor = document.getElementById('lista-propiedades');
        const sky = document.getElementById('main-sky');

        function renderizarMenu() {
            catalogo.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<strong>${item.titulo}</strong>`;
                div.onclick = () => seleccionar(index, div);
                contenedor.appendChild(div);
            });
        }

        function seleccionar(index, elemento) {
            const p = catalogo[index];
            
            // Cambiamos la foto usando el ID del asset
            sky.setAttribute('src', p.fotoId);
            
            // Actualizamos textos
            document.getElementById('p-titulo').innerText = p.titulo;
            document.getElementById('p-desc').innerText = p.desc;
            document.getElementById('p-specs').innerText = p.specs;

            // Estilo del menú
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            elemento.classList.add('active');
        }

        // Iniciar todo
        window.onload = () => {
            renderizarMenu();
            seleccionar(0, document.querySelector('.card'));
        };

        // Detector de errores por si los nombres fallan
        document.querySelector('a-assets').addEventListener('timeout', () => {
            document.getElementById('error-log').style.display = 'block';
            document.getElementById('error-log').innerText = "Error: Verifica los nombres .jpeg en GitHub";
        });
    </script>
</body>
</html>
