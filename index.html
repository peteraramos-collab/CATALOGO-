<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ges-in | Catálogo Inmobiliario 360</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        :root { --azul: #3498db; --oscuro: #1a1a1a; --oro: #f1c40f; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Panel Lateral */
        #sidebar {
            position: fixed;
            top: 0; left: 0; width: 320px; height: 100%;
            background: var(--oscuro);
            color: white;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
        }

        .header-logo { padding: 20px; text-align: center; background: white; }
        .header-logo img { max-width: 180px; }

        #lista-propiedades {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .card {
            background: #2c3e50;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: 0.3s;
        }

        .card:hover { border-left-color: var(--oro); background: #34495e; }
        .card.active { border-left-color: var(--azul); background: #34495e; }

        .info-box {
            background: #000;
            padding: 20px;
            font-size: 0.9em;
            border-top: 1px solid #444;
        }

        .btn-wa {
            display: block;
            text-align: center;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header-logo">
            <img src="Gesin.png" alt="Gestiones Integrales">
        </div>
        
        <div id="lista-propiedades">
            </div>

        <div class="info-box" id="detalle-propiedad">
            <h3 id="p-titulo" style="margin:0; color: var(--oro);">Seleccione una propiedad</h3>
            <p id="p-desc" style="opacity: 0.8; margin: 10px 0;">Ges-in facilitando tus trámites.</p>
            <div id="p-specs" style="font-weight: bold; color: var(--azul);"></div>
            <a href="https://wa.me/tu_numero" class="btn-wa">Consultar por WhatsApp</a>
        </div>
    </div>

    <a-scene embedded style="width: 100%; height: 100vh;">
        <a-sky id="main-sky" src="mifoto.jpg" rotation="0 -90 0"></a-sky>
        <a-entity camera look-controls>
            <a-cursor color="var(--oro)"></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        // ESTA ES TU "BASE DE DATOS" INTUITIVA
        // Para agregar una propiedad, solo copia y pega un bloque de estos { ... }
        const catalogo = [
            {
                titulo: "Oficina Matriz Ges-in",
                ubicacion: "San Miguel de los Bancos",
                descripcion: "Sede principal para gestiones técnicas y administrativas.",
                specs: "Área: 45m² | Internet fibra óptica",
                foto: "mifoto.jpg" // Nombre del archivo en tu carpeta
            },
            {
                titulo: "Terreno Sector Pacto",
                ubicacion: "Pacto, Pichincha",
                descripcion: "Terreno con vista privilegiada ideal para proyectos turísticos.",
                specs: "Área: 9 Hectáreas | Acceso a río",
                foto: "terreno_pacto.jpg" 
            },
            {
                titulo: "Lote Urbano 02",
                ubicacion: "Centro de San Miguel",
                descripcion: "Lote listo para construcción residencial.",
                specs: "Área: 600m² | Todos los servicios",
                foto: "lote02.jpg"
            }
        ];

        const contenedor = document.getElementById('lista-propiedades');

        function renderizarMenu() {
            contenedor.innerHTML = '';
            catalogo.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<strong>${item.titulo}</strong><br><small>${item.ubicacion}</small>`;
                div.onclick = () => seleccionar(index, div);
                contenedor.appendChild(div);
            });
        }

        function seleccionar(index, elemento) {
            const p = catalogo[index];
            
            // Cambiar imagen 360
            document.getElementById('main-sky').setAttribute('src', p.foto);
            
            // Cambiar textos
            document.getElementById('p-titulo').innerText = p.titulo;
            document.getElementById('p-desc').innerText = p.descripcion;
            document.getElementById('p-specs').innerText = p.specs;

            // Marcar como activo en el menú
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            elemento.classList.add('active');
        }

        renderizarMenu();
        // Cargar la primera por defecto
        seleccionar(0, document.querySelector('.card'));
    </script>
</body>
</html>
