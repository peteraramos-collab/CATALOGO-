<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ges-in | Inmobiliaria 360° Elite</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        :root { 
            --azul: #2980b9; --oscuro: #121212; --oro: #f1c40f; 
            --verde: #27ae60; --rojo: #e74c3c;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }

        /* Panel Lateral */
        #sidebar {
            position: fixed; top: 0; left: 0; width: 340px; height: 100%;
            background: linear-gradient(180deg, var(--oscuro) 0%, #1e272e 100%);
            color: white; z-index: 2000; display: flex; flex-direction: column;
            box-shadow: 5px 0 25px rgba(0,0,0,0.7); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header-logo { padding: 25px; text-align: center; background: #fff; border-bottom: 4px solid var(--oro); }
        .header-logo img { max-width: 160px; height: auto; }

        /* Buscador */
        .search-container { padding: 15px; background: rgba(255,255,255,0.05); }
        #search-input { 
            width: 100%; padding: 10px; border-radius: 20px; border: none; 
            background: #34495e; color: white; outline: none; font-size: 0.9em;
        }

        #lista-propiedades { flex-grow: 1; overflow-y: auto; padding: 15px; }
        
        .card {
            background: rgba(255,255,255,0.05); padding: 15px; margin-bottom: 12px;
            border-radius: 12px; cursor: pointer; transition: 0.3s; border-left: 5px solid transparent;
        }
        .card:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); }
        .card.active { border-left-color: var(--oro); background: rgba(52, 152, 219, 0.2); }

        /* Visualizador de Info */
        .info-box { background: rgba(0,0,0,0.9); padding: 20px; border-top: 3px solid var(--azul); }
        .price-tag { font-size: 1.4em; color: var(--oro); font-weight: bold; margin-bottom: 5px; }
        
        .galeria-minis { display: flex; gap: 10px; margin: 15px 0; overflow-x: auto; padding-bottom: 5px; }
        .mini { width: 80px; height: 60px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
        .mini:hover { border-color: var(--oro); }

        .btn-wa {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: var(--verde); color: white; text-decoration: none;
            padding: 14px; border-radius: 8px; font-weight: bold; transition: 0.3s;
        }
        .btn-wa:hover { filter: brightness(1.1); transform: scale(1.02); }

        /* Controles de Escena */
        #ui-controls { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 10px; }
        .control-btn { 
            background: rgba(0,0,0,0.6); color: white; border: 1px solid var(--oro);
            padding: 10px; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; 
        }

        /* Modal */
        #modal-visor {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center;
        }
        #modal-img { max-width: 90%; max-height: 85%; border: 4px solid #fff; box-shadow: 0 0 30px rgba(0,0,0,1); }

        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); width: 300px; }
            #sidebar.open { transform: translateX(0); }
            .toggle-mobile { display: block !important; position: fixed; top: 15px; left: 15px; z-index: 3000; background: var(--azul); border: none; color: white; padding: 10px; border-radius: 5px; }
        }
    </style>
</head>
<body>

    <button class="toggle-mobile" style="display:none" onclick="toggleSidebar()">☰ Menú</button>

    <div id="ui-controls">
        <button class="control-btn" title="Pantalla Completa" onclick="document.documentElement.requestFullscreen()">⛶</button>
        <button class="control-btn" title="Ayuda" onclick="alert('Arrastra para girar. Haz clic en los puntos verdes para ver detalles.')">?</button>
    </div>

    <div id="sidebar">
        <div class="header-logo"><img src="Gesin.png" alt="Ges-in"></div>
        
        <div class="search-container">
            <input type="text" id="search-input" placeholder="🔍 Buscar por sector o precio..." onkeyup="filtrarPropiedades()">
        </div>

        <div id="lista-propiedades"></div>

        <div class="info-box">
            <div id="p-precio" class="price-tag"></div>
            <h3 id="p-titulo" style="color: var(--azul); margin-bottom: 10px;"></h3>
            <p id="p-desc" style="font-size: 0.85em; line-height: 1.4; color: #ccc;"></p>
            <div class="galeria-minis" id="p-galeria"></div>
            <a href="#" id="btn-whatsapp-link" class="btn-wa" target="_blank">
                <span>Contactar Asesor</span>
            </a>
        </div>
    </div>

    <div id="modal-visor" onclick="this.style.display='none'">
        <img id="modal-img" src="">
    </div>

    <a-scene loading-screen="dotsColor: gold; backgroundColor: black" renderer="antialias: true; exposure: 1.2;">
        <a-assets>
            <img id="360_1" src="1.jpeg">
            <img id="360_2" src="2.jpeg">
            <img id="360_3" src="mifoto.jpeg">
        </a-assets>

        <a-sky id="main-sky" radius="100" src="#360_1" animation__fade="property: components.material.material.opacity; from: 0; to: 1; dur: 500; startEvents: loaded"></a-sky>

        <a-entity id="hotspots-container"></a-entity>

        <a-entity camera look-controls position="0 1.6 0">
            <a-cursor color="white" raycaster="objects: .clickable"></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        const AGENTE_WA = "593995042091";

        const catalogo = [
            { 
                titulo: "🌄 Hacienda El Pacto", sector: "Pacto", precio: 45000, 
                desc: "9 Hectáreas de suelo virgen. Incluye vertiente de agua propia y acceso directo.",
                foto: "#360_1", extras: ["a.jpg", "b.jpg"],
                hotspots: [{pos: "10 2 -15", msg: "Acceso Vehicular"}, {pos: "-15 1 5", msg: "Vertiente de Agua"}]
            },
            { 
                titulo: "🏢 Lote Comercial Centro", sector: "Centro", precio: 120000, 
                desc: "600m2 en zona de alta plusvalía. Ideal para locales o edificios.",
                foto: "#360_2", extras: ["c.jpg", "d.jpg"],
                hotspots: [{pos: "0 2 -20", msg: "Frente principal de 20m"}]
            },
            { 
                titulo: "🏞️ Reserva San Miguel", sector: "Reserva", precio: 85000, 
                desc: "Bosque protector con senderos. Ideal para proyecto ecoturístico.",
                foto: "#360_3", extras: ["a.jpg", "d.jpg"],
                hotspots: [{pos: "20 5 0", msg: "Mirador Panorámico"}]
            }
        ];

        function renderizar(items) {
            const container = document.getElementById('lista-propiedades');
            container.innerHTML = '';
            items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<strong>${item.titulo}</strong><br><small>📍 ${item.sector} | $${item.precio.toLocaleString()}</small>`;
                div.onclick = () => seleccionar(item, div);
                container.appendChild(div);
            });
        }

        function filtrarPropiedades() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtrados = catalogo.filter(p => 
                p.titulo.toLowerCase().includes(query) || 
                p.sector.toLowerCase().includes(query)
            );
            renderizar(filtrados);
        }

        function seleccionar(p, elemento) {
            // Actualizar 360
            document.querySelector('#main-sky').setAttribute('src', p.foto);
            
            // Actualizar Panel
            document.getElementById('p-titulo').innerText = p.titulo;
            document.getElementById('p-precio').innerText = `$${p.precio.toLocaleString()}`;
            document.getElementById('p-desc').innerText = p.desc;
            
            // Galería
            const gal = document.getElementById('p-galeria');
            gal.innerHTML = '';
            p.extras.forEach(img => {
                const m = document.createElement('img');
                m.src = img; m.className = 'mini';
                m.onclick = () => {
                    document.getElementById('modal-img').src = img;
                    document.getElementById('modal-visor').style.display = 'flex';
                };
                gal.appendChild(m);
            });

            // WhatsApp
            const msg = `Hola Ges-in, solicito información de: ${p.titulo} ($${p.precio})`;
            document.getElementById('btn-whatsapp-link').href = `https://wa.me/${AGENTE_WA}?text=${encodeURIComponent(msg)}`;

            // UI
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            elemento.classList.add('active');

            // Hotspots
            const container = document.getElementById('hotspots-container');
            container.innerHTML = '';
            p.hotspots.forEach(h => {
                const s = document.createElement('a-sphere');
                s.setAttribute('position', h.pos);
                s.setAttribute('radius', '0.5');
                s.setAttribute('color', '#00ff00');
                s.setAttribute('class', 'clickable');
                s.onclick = () => alert(h.msg);
                container.appendChild(s);
            });
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        window.onload = () => {
            renderizar(catalogo);
            seleccionar(catalogo[0], document.querySelector('.card'));
        };
    </script>
</body>
</html>
