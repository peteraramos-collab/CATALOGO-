<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- PASO 3: METATAGS PARA REDES SOCIALES Y WHATSAPP -->
    <title>Ges-in | Catálogo Inmobiliario 360°</title>
    <meta name="description" content="Explora terrenos y proyectos en San Miguel de los Bancos con tours virtuales interactivos.">
    
    <!-- Configuración visual para el link (Open Graph) -->
    <meta property="og:title" content="Ges-in | Propiedades Elite 360°">
    <meta property="og:description" content="Visualiza tu próxima inversión con realidad virtual. Terrenos en San Miguel de los Bancos y Pacto.">
    <meta property="og:image" content="Gesin.png"> <!-- Asegúrate que el logo se llame así -->
    <meta property="og:type" content="website">

    <!-- Librería A-Frame para VR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <style>
        :root { 
            --azul: #2980b9; --oscuro: #121212; --oro: #f1c40f; 
            --verde: #27ae60; --gris: #34495e;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }

        /* Panel Lateral Izquierdo */
        #sidebar {
            position: fixed; top: 0; left: 0; width: 340px; height: 100%;
            background: linear-gradient(180deg, var(--oscuro) 0%, #1e272e 100%);
            color: white; z-index: 2000; display: flex; flex-direction: column;
            box-shadow: 5px 0 25px rgba(0,0,0,0.7); transition: transform 0.4s ease;
        }

        .header-logo { padding: 25px; text-align: center; background: #fff; border-bottom: 4px solid var(--oro); }
        .header-logo img { max-width: 160px; height: auto; }

        .search-container { padding: 15px; background: rgba(255,255,255,0.05); }
        #search-input { 
            width: 100%; padding: 12px; border-radius: 25px; border: none; 
            background: var(--gris); color: white; outline: none; font-size: 0.9em;
        }

        #lista-propiedades { flex-grow: 1; overflow-y: auto; padding: 15px; }
        
        .card {
            background: rgba(255,255,255,0.05); padding: 15px; margin-bottom: 12px;
            border-radius: 12px; cursor: pointer; transition: 0.3s; border-left: 5px solid transparent;
        }
        .card:hover { background: rgba(255,255,255,0.1); transform: translateX(5px); }
        .card.active { border-left-color: var(--oro); background: rgba(52, 152, 219, 0.2); }

        /* Cuadro de Información Inferior */
        .info-box { background: rgba(0,0,0,0.95); padding: 20px; border-top: 3px solid var(--azul); }
        .price-tag { font-size: 1.5em; color: var(--oro); font-weight: bold; margin-bottom: 5px; }
        
        .galeria-minis { display: flex; gap: 10px; margin: 15px 0; overflow-x: auto; padding-bottom: 10px; }
        .mini { width: 80px; height: 60px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
        .mini:hover { border-color: var(--oro); }

        /* Botones Estilizados */
        .btn-action {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: white; text-decoration: none; padding: 14px; border-radius: 8px; 
            font-weight: bold; transition: 0.3s; margin-bottom: 10px; width: 100%;
            border: none; cursor: pointer; font-family: inherit;
        }
        .btn-wa { background: var(--verde); }
        .btn-mapa { background: var(--azul); }
        .btn-action:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* Botón Menú Móvil */
        .toggle-mobile { 
            display: none; position: fixed; top: 15px; left: 15px; z-index: 3000; 
            background: var(--azul); border: none; color: white; padding: 12px; 
            border-radius: 8px; font-weight: bold;
        }

        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); width: 300px; }
            #sidebar.open { transform: translateX(0); }
            .toggle-mobile { display: block; }
        }
    </style>
</head>
<body>

    <button class="toggle-mobile" onclick="toggleSidebar()">☰ Ver Catálogo</button>

    <div id="sidebar">
        <div class="header-logo">
            <img src="Gesin.png" alt="Ges-in" onerror="this.style.display='none'">
            <h2 style="color: #333; margin-top: 5px;">Ges-in</h2>
        </div>
        
        <div class="search-container">
            <input type="text" id="search-input" placeholder="🔍 Buscar por sector o precio..." onkeyup="filtrarPropiedades()">
        </div>

        <div id="lista-propiedades"></div>

        <div class="info-box">
            <div id="p-precio" class="price-tag"></div>
            <h3 id="p-titulo" style="color: var(--azul); margin-bottom: 5px;"></h3>
            <p id="p-desc" style="font-size: 0.85em; color: #ccc; margin-bottom: 15px; line-height: 1.4;"></p>
            
            <div class="galeria-minis" id="p-galeria"></div>
            
            <a href="#" id="btn-whatsapp-link" class="btn-action btn-wa" target="_blank">
                💬 Contactar Asesor
            </a>

            <a href="#" id="btn-mapa-link" class="btn-action btn-mapa" target="_blank">
                📍 Ver Ubicación Exacta
            </a>
        </div>
    </div>

    <!-- Escena de Realidad Virtual -->
    <a-scene loading-screen="dotsColor: #f1c40f; backgroundColor: #121212" renderer="antialias: true;">
        <a-assets>
            <!-- Asegúrate de que estos nombres de archivos coincidan con tus archivos en la carpeta -->
            <img id="360_1" src="1.jpeg">
            <img id="360_2" src="2.jpeg">
            <img id="360_3" src="mifoto.jpeg">
        </a-assets>

        <a-sky id="main-sky" radius="100" src="#360_1" animation__fade="property: components.material.material.opacity; from: 0; to: 1; dur: 500"></a-sky>

        <a-entity id="hotspots-container"></a-entity>

        <a-entity camera look-controls position="0 1.6 0">
            <a-cursor color="#f1c40f" fuse="false" raycaster="objects: .clickable"></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        const AGENTE_WA = "593995042091";

        // BASE DE DATOS CON TUS LINKS DE GOOGLE MAPS
        const catalogo = [
            { 
                titulo: "🌄 Hacienda El Pacto", sector: "Pacto", precio: 45000, 
                desc: "Extenso terreno ideal para agricultura o desarrollo turístico con vistas privilegiadas.",
                foto: "#360_1", extras: ["a.jpg", "b.jpg"],
                mapa: "https://maps.app.goo.gl/5uY6cs62Q182YEwV6",
                hotspots: [{pos: "10 2 -15", msg: "Límite Norte"}]
            },
            { 
                titulo: "🏢 Lote Urbano Bancos", sector: "San Miguel", precio: 120000, 
                desc: "Ubicación estratégica en el centro de la ciudad. Alta plusvalía y listo para construir.",
                foto: "#360_2", extras: ["c.jpg", "d.jpg"],
                mapa: "https://maps.app.goo.gl/edmdTUW8C1ZQEQVh8",
                hotspots: [{pos: "-5 1.5 -10", msg: "Acceso Comercial"}]
            },
            { 
                titulo: "🏞️ Quinta La Reserva", sector: "Pacto", precio: 85000, 
                desc: "Un paraíso natural con acceso a senderos y clima subtropical único.",
                foto: "#360_3", extras: ["a.jpg", "c.jpg"],
                mapa: "https://maps.app.goo.gl/4BFEYtUx6BmP4kt97",
                hotspots: [{pos: "15 5 0", msg: "Zona de Mirador"}]
            }
        ];

        function renderizar(items) {
            const container = document.getElementById('lista-propiedades');
            container.innerHTML = '';
            items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<strong>${item.titulo}</strong><br><small>📍 ${item.sector} | $${item.precio.toLocaleString()}</small>`;
                div.onclick = () => seleccionar(item, div);
                container.appendChild(div);
            });
        }

        function filtrarPropiedades() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtrados = catalogo.filter(p => 
                p.titulo.toLowerCase().includes(query) || 
                p.sector.toLowerCase().includes(query)
            );
            renderizar(filtrados);
        }

        function seleccionar(p, elemento) {
            // Cambio suave de la imagen 360
            const sky = document.querySelector('#main-sky');
            sky.setAttribute('src', p.foto);
            
            // Actualizar Textos del Panel
            document.getElementById('p-titulo').innerText = p.titulo;
            document.getElementById('p-precio').innerText = `$${p.precio.toLocaleString()}`;
            document.getElementById('p-desc').innerText = p.desc;
            
            // Generar Miniaturas de Galería
            const gal = document.getElementById('p-galeria');
            gal.innerHTML = '';
            p.extras.forEach(img => {
                const m = document.createElement('img');
                m.src = img; m.className = 'mini';
                // Si la imagen extra no existe, ponemos una de respaldo
                m.onerror = () => m.src = "https://via.placeholder.com/80x60?text=Gesin";
                gal.appendChild(m);
            });

            // Actualizar Enlace de WhatsApp
            const msg = `Hola Ges-in, me interesa la propiedad: ${p.titulo} ($${p.precio})`;
            document.getElementById('btn-whatsapp-link').href = `https://wa.me/${AGENTE_WA}?text=${encodeURIComponent(msg)}`;

            // Actualizar Enlace de Google Maps
            const btnMapa = document.getElementById('btn-mapa-link');
            if(p.mapa) {
                btnMapa.href = p.mapa;
                btnMapa.style.display = 'flex';
            } else {
                btnMapa.style.display = 'none';
            }

            // Marcar propiedad como activa en la lista
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            if(elemento) elemento.classList.add('active');
        }

        function toggleSidebar() { 
            document.getElementById('sidebar').classList.toggle('open'); 
        }

        // Carga inicial
        window.onload = () => {
            renderizar(catalogo);
            // Seleccionar la primera por defecto
            if(catalogo.length > 0) seleccionar(catalogo[0], document.querySelector('.card'));
        };
    </script>
</body>
</html>
